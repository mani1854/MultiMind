apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnimind-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: omnimind-api
  template:
    metadata:
      labels:
        app: omnimind-api
    spec:
      containers:
        - name: api
          image: omnimind-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: omnimind-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: omnimind-api
spec:
  selector:
    app: omnimind-api
  ports:
    - port: 8000
      targetPort: 8000

