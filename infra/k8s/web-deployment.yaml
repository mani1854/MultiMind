apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnimind-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: omnimind-web
  template:
    metadata:
      labels:
        app: omnimind-web
    spec:
      containers:
        - name: web
          image: omnimind-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.omnimind.local"
---
apiVersion: v1
kind: Service
metadata:
  name: omnimind-web
spec:
  selector:
    app: omnimind-web
  ports:
    - port: 3000
      targetPort: 3000

